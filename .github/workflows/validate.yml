name: Validate foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/setup
      - run: scripts/check
      - run: TESTYCO_UID=$(id -u) TESTYCO_GID=$(id -g) docker compose up -d --wait
      - run: python3 scripts/smoke.py
      - run: python3 scripts/smoke-identity.py
      - run: python3 scripts/smoke-smtp.py
      - if: always()
        run: docker compose down
