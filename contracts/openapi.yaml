          },
          {
            "in": "query",
            "name": "from",
            "schema": {
              "type": "string",
              "format": "date-time"
            },
            "description": "Paired timezone-explicit interval bound; from inclusive, to exclusive, maximum 31 days."
          },
          {
            "in": "query",
            "name": "to",
            "schema": {
              "type": "string",
              "format": "date-time"
            },
            "description": "Paired timezone-explicit interval bound; from inclusive, to exclusive, maximum 31 days."
          },
          {
            "in": "query",
            "name": "q",
            "schema": {
              "type": "string",
              "maxLength": 100
            },
            "description": "Receipt number search; does not broaden cashier/store scope."
          }
        ],
        "description": "Read-only paginated history (50/page), newest ID first. No interval retains legacy all-history access; optional paired ISO timezone bounds are [from,to), at most 31 days. q searches receipt number (SQL LIKE). Cashiers see own receipts; authorized managers see the store. Inactive stores remain readable within an active organization. Data pages are live reads, not a frozen snapshot. Master updates never rewrite historical receipt values. External pagination URLs must not be used by native clients."
      }
    },
