          }
        ],
        "description": "Read-only price-free batch catalogue with historical batch snapshots and current bucket balances. Existing assigned-store access (including cashier) and inactive-store reads are preserved; central onboarding gives no partner operational access. Defaults retain all batches and expires_on/id ascending pagination100. Optional independent expires_from/expires_to are inclusive calendar packaging dates, not UTC instants or a warning horizon; no arbitrary31-day cap. q searches historical SKU/name/batch code via LIKE. with_balance=1 requires a positive usable/opened/ready/quarantined bucket; cumulative waste alone does not qualify. Filters are ANDed under store scope. No sale block, FEFO allocation, food-quality certification, ready-food shelf life or recall is introduced. Pages are live reads."
      }
    },
