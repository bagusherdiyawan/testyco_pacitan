        "required": [
          "approve",
          "reject",
          "cancel",
          "receive",
          "amend"
        ],
        "description": "GET order detail hints, never mutation authorization. Approve/reject require recipient approver role and awaiting_approval/rejected state; cancel additionally supports approved/processing before first dispatch. Receive requires recipient role, active target and Fulfillment enabled in dispatched/partially_received state; client still checks a shipment is unreceived. Supplier view and inactive target have all false. Internal transfers require center owner/admin approval, wholesale requires partner lead. Amend follows the existing approver policy and OrderState, not the permission to create a request."
      },
