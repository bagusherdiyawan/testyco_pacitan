    "/api/v1/stores/{store}/inventory/minimums": {
      "get": {
        "operationId": "stockMinimumReport",
        "summary": "Live low-stock warnings and per-store SKU thresholds",
        "description": "Active products only, including SKUs without batches (zero stock). available_pieces sums intact + opened + ready from this store across batches; quarantine and waste are excluded. This is physical inventory availability, not food safety certification, expiry filtering or ready-to-serve quantity. is_low uses strict available < configured minimum; equality is healthy, null is unconfigured/disabled, and zero is enabled. No defaults, reservation, purchase/payment automation, historical crossing events, push/email or delivery/read receipts. All assigned operational roles may read; no wholesale/retail price is exposed. Refresh to observe new movements. Paginated 50 rows; each page is a live observation, not a cross-page stock snapshot.",
        "parameters": [
          {
            "in": "path",
            "name": "store",
            "required": true,
            "schema": {
              "type": "string",
              "description": "ULID"
            }
          },
          {
            "in": "query",
            "name": "q",
            "schema": {
              "type": "string",
              "maxLength": 100
            }
          },
          {
            "in": "query",
            "name": "low_only",
