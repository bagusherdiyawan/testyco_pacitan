            "description": "Organization/store/action denied",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Not found",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Inactive organization/store or unavailable state",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "422": {
            "description": "Invalid exact filters/page, unpaired or timezone-less dates, reversed interval, or range exceeding 31 days.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "Rate limit exceeded",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "description": "Read-only organization audit, 50 rows/page ordered by descending ID (legacy ordering preserved). Without paired dates, legacy all-history pagination remains. from/to must be paired timezone-explicit [from,to) bounds, at most 31 days. action, subject_id and actor_id are exact filters; AND with existing organization/onboarding authorization. Organization managers read operational events; central administrators without a managing membership retain only the existing onboarding allowlist. Global events with null organization_id (including password changes) are outside this view. Before/after are historical JSON snapshots, not current master data; null means no stored snapshot. Each page is a live read, not a frozen snapshot. Private/no-store.",
        "parameters": [
          {
            "in": "path",
            "name": "organization",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "query",
            "name": "page",
            "schema": {
              "type": "integer",
              "minimum": 1
            }
          },
          {
            "in": "query",
            "name": "from",
            "schema": {
              "type": "string",
              "format": "date-time"
            },
            "description": "Paired timezone interval, maximum 31 days; from inclusive, to exclusive."
          },
          {
            "in": "query",
            "name": "to",
            "schema": {
              "type": "string",
              "format": "date-time"
            },
            "description": "Paired timezone interval, maximum 31 days; from inclusive, to exclusive."
          },
          {
            "in": "query",
            "name": "action",
            "schema": {
              "type": "string",
              "maxLength": 80
            },
            "description": "Exact value; does not broaden visibility."
          },
          {
            "in": "query",
            "name": "subject_id",
            "schema": {
              "type": "string",
              "maxLength": 80
            },
            "description": "Exact value; does not broaden visibility."
          },
          {
            "in": "query",
            "name": "actor_id",
            "schema": {
              "type": "integer",
              "minimum": 1
            },
            "description": "Exact actor user ID; no lookup of other organizations."
          }
        ]
      }
    },
